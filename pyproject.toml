[project]
name = "northstar-credit-platform"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "jsonschema>=4.23,<5",
  "pydantic>=2.11,<3",
  "pyyaml>=6.0,<7",
]

[dependency-groups]
dev = [
  "mypy==1.20.2",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff==0.16.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
pythonpath = ["packages/credit_engine"]
testpaths = ["tests"]

[tool.mypy]
strict = true

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "SIM"]

[tool.coverage.run]
branch = true
source = ["credit_engine"]

[tool.coverage.report]
fail_under = 90
show_missing = true
